{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="/lightfair.css">
<link rel="stylesheet" href="https://unpkg.com/highlightjs-copy@1.0.6/dist/highlightjs-copy.min.css">
<script src="/mathjax-config.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"></script>
<script src="/highlight.min.js"></script>
<script src="https://unpkg.com/highlightjs-copy@1.0.6/dist/highlightjs-copy.min.js"></script>
{% if plotly %}
<script async defer src="https://cdn.plot.ly/plotly-latest.min.js"></script>{% endif %}
{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<time>{{ date }}</time>
<div class="post-body">
  {{ html }}
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/post.js"></script>
{% endblock %}
