{% extends "base.html" %}

{% block content %}
<h2>Posts</h2>
<section id="sounds">
  {% for sound in sounds %}
  <div class="item-box">
    <a class="item-link" href="/audio/{{ sound.meta.slug }}/">
      <article class="sound-item">
        <h3>{{ sound.meta.title }}</h3>
        <time>{{ sound.meta.date }}</time>
        <audio controls>
          <source src="/audio/files/{{ sound.meta.audiopath }}" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </article>
    </a>
  </div>
  {% endfor %}
</section>
{% endblock %}
